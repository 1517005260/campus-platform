[project]
name = "common"
version = "0.1.0"
description = "公共服务：鉴权、RBAC、通知、审计"
requires-python = ">=3.12"
dependencies = [
    "campus-common[mq]",
    "bcrypt>=4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "time-machine>=2.15",
]

[tool.uv]
package = false

[tool.uv.sources]
campus-common = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["db: 需要 Postgres（CI 中自动提供；本地先启动 docker-compose.dev.yml）"]

[tool.coverage.run]
source = ["app"]
# 异步会话经 greenlet 执行，不开启 greenlet 跟踪时 await 之后的代码都会被算作未覆盖
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
# 接口全部实现后的基线（实测约 98%）；只升不降
fail_under = 90
