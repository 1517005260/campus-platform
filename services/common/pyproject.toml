[project]
name = "common"
version = "0.1.0"
description = "公共服务：鉴权、RBAC、通知、审计"
requires-python = ">=3.12"
dependencies = [
    "campus-common[mq]",
    "bcrypt>=4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "time-machine>=2.15",
]

[tool.uv]
package = false

[tool.uv.sources]
campus-common = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["db: 需要 Postgres（CI 中自动提供；本地先启动 docker-compose.dev.yml）"]

[tool.coverage.run]
source = ["app"]
omit = ["app/stubs.py"]

[tool.coverage.report]
# 桩阶段的起点；每完成一批真实实现就上调，第二次 Review 前达到 70
fail_under = 50
