[project]
name = "m1-seat"
version = "0.1.0"
description = "M1 自习座位预约"
requires-python = ">=3.12"
dependencies = [
    "campus-common",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "time-machine>=2.15",
]

[tool.uv]
package = false

[tool.uv.sources]
campus-common = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["db: 需要 Postgres（CI 中自动提供；本地先启动 docker-compose.dev.yml）"]

[tool.coverage.run]
source = ["app"]
omit = ["app/stubs.py"]

[tool.coverage.report]
# 桩阶段的起点；每完成一批真实实现就上调，第二次 Review 前达到 70
fail_under = 50

[tool.mutmut]
# 只对核心业务逻辑做变异；随着实现推进把新的业务文件加进来
source_paths = ["app/jobs.py", "app/rules.py"]
also_copy = ["app", "alembic.ini", "migrations"]
