[project]
name = "campus-platform"
version = "0.1.0"
description = "校园资源服务平台（monorepo 根，不含可安装代码）"
requires-python = ">=3.12"

[dependency-groups]
# 跨模块集成测试（scripts/integration_test.sh）只依赖这两个包，版本由 uv.lock 固定
integration = ["pytest>=8.3", "httpx>=0.27"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/campus_common", "services/*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "DTZ"]
# DTZ：禁止生成不带时区的 datetime；本项目全部时间计算依赖时区正确
ignore = ["B008"]  # FastAPI 的 Depends() 默认参数写法

[tool.ruff.lint.per-file-ignores]
"**/migrations/versions/*.py" = ["E501"]
