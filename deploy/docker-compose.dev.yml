# 开发环境：只运行外部依赖和网关，业务服务在本机 IDE 里运行（8001–8004，前端 3000）。
#   docker compose -f deploy/docker-compose.dev.yml up -d
# 端口只绑定 127.0.0.1，账号密码为开发默认值，不要在共享网络中对外开放。
name: campus-dev

services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus
      POSTGRES_DB: campus
      DB_PASSWORD_COMMON: common_svc
      DB_PASSWORD_M1: m1_seat
      DB_PASSWORD_M2: m2_room
      DB_PASSWORD_M3: m3_repair
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./postgres/test-db.sh:/docker-entrypoint-initdb.d/test-db.sh:ro # 测试库 campus_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus"]
      interval: 5s

  redis:
    image: redis:7.4.11
    ports: ["127.0.0.1:6379:6379"]

  rabbitmq:
    image: rabbitmq:4.3.6-management
    hostname: rabbitmq # 数据目录按主机名区分，固定后重建容器数据仍在
    environment:
      RABBITMQ_DEFAULT_USER: campus
      RABBITMQ_DEFAULT_PASS: campus
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"] # 15672 为管理界面
    volumes: [rabbitmq:/var/lib/rabbitmq]

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"] # 8025 网页查看收到的邮件

  gateway:
    image: nginxinc/nginx-unprivileged:1.27.5-alpine
    ports: ["127.0.0.1:8000:8080"]
    environment:
      COMMON_UPSTREAM: host.docker.internal:8004
      M1_UPSTREAM: host.docker.internal:8001
      M2_UPSTREAM: host.docker.internal:8002
      M3_UPSTREAM: host.docker.internal:8003
      FRONTEND_UPSTREAM: host.docker.internal:3000
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./gateway/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/upstreams.dev.conf.template:/etc/nginx/templates/00-upstreams.conf.template:ro

volumes:
  pgdata:
  rabbitmq:
