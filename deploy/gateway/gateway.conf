# 网关：唯一对外入口，按路径前缀转发到各服务；/internal 不对外。
# 路由表各环境共用；上游地址在 upstreams*.conf.template 中按环境定义（部署环境动态解析容器地址）。

# 只接受格式合法的 X-Request-ID（字母、数字、连字符，最长 64 位），否则生成新的
map $http_x_request_id $req_id {
    "~^[A-Za-z0-9-]{1,64}$" $http_x_request_id;
    default                 $request_id;
}

server {
    listen 8080;
    client_max_body_size 10m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $req_id;
    # 网关是最外层入口：用对端地址覆盖客户端自带的转发头，后端据此记录真实来源，不能被伪造
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Request-ID; # 后端回传的同一个值，由网关统一输出一份
    add_header X-Request-ID $req_id always;

    location = /healthz { access_log off; return 204; }

    location /internal/ { return 404; }

    location /api/v1/auth/          { proxy_pass http://common_api; }
    location /api/v1/admin/         { proxy_pass http://common_api; }
    location ~ ^/api/v1/(notifications|audit)(/|$) { proxy_pass http://common_api; }
    location /api/v1/seat/          { proxy_pass http://m1_api; }
    location /api/v1/room/          { proxy_pass http://m2_api; }
    location /api/v1/repair/        { proxy_pass http://m3_api; }

    # 未匹配的接口路径直接 404，不落到前端（开发环境前端会把 /api 代理回网关，形成循环）
    location /api/ {
        default_type application/json;
        return 404 '{"code":"NOT_FOUND","message":"接口不存在","details":null,"request_id":"$req_id"}';
    }

    # 运维：/ops/<服务>/(health|ready|version)
    location ~ ^/ops/common/(health|ready|version)$ { proxy_pass http://common_api/$1; }
    location ~ ^/ops/m1/(health|ready|version)$     { proxy_pass http://m1_api/$1; }
    location ~ ^/ops/m2/(health|ready|version)$     { proxy_pass http://m2_api/$1; }
    location ~ ^/ops/m3/(health|ready|version)$     { proxy_pass http://m3_api/$1; }
    location /ops/ { return 404; }

    location / { proxy_pass http://frontend; }
}
