[project]
name = "campus-common"
version = "0.1.0"
description = "各服务共用的基础库：鉴权、错误、分页、时间、服务间调用、消息拓扑与可靠消费、outbox/inbox、调度锁"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "celery>=5.4",
    "redis>=5.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# 消费端运行时（campus_common.consuming）：只有运行消息消费者的服务需要
mq = ["faststream[rabbit,cli]>=0.6,<0.8"]

[project.entry-points.pytest11]
# 测试数据库保护：需要数据库的测试只允许连接 *_test 库
campus_common = "campus_common.pytest_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/campus_common"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "time-machine>=2.15"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
