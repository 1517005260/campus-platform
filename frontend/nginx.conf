# 前端容器内的 nginx：托管静态文件，所有未知路径回退到 index.html（单页应用路由）。
# 接口请求由外层网关转发，不经过这里。
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # 构建产物文件名带内容哈希，可长期缓存；index.html 每次重新验证，发布后立即引用新的产物
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /healthz {
        access_log off;
        return 204;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
